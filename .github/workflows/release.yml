name: release

# 打 v* tag 自动触发,或 Actions 页手动触发(从 main)。
# 4 个平台(linux-x64/arm64、darwin-arm64、win32-x64)原生构建,全过才发主包。
# Intel Mac(darwin-x64)已放弃:ort 对 x86_64-apple-darwin 无预编译、不能从 arm64
# 交叉编译,只能用 macos-13 原生 runner——0.1.39/0.1.40 连续两版 5 次排队(最长 6h+)
# 零次排到,该 runner 已进 GitHub 退役流程,不再尝试(0.1.41 起)。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-platform:
    name: build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-14
            target: aarch64-apple-darwin
            executable: repo-intelligence
            pkg-dir: packages/npm-platforms/darwin-arm64
          - platform: linux-x64-gnu
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            executable: repo-intelligence
            pkg-dir: packages/npm-platforms/linux-x64-gnu
          - platform: linux-arm64-gnu
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            executable: repo-intelligence
            pkg-dir: packages/npm-platforms/linux-arm64-gnu
          - platform: win32-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            executable: repo-intelligence.exe
            pkg-dir: packages/npm-platforms/win32-x64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '.'
          key: ${{ matrix.target }}

      # embedding 模型 gitignore,不进仓库。build.rs 缺模型时调 bash,但 Windows build.rs
      # 子进程找不到 bash 会崩 → include_bytes! 失败。故构建前统一 shell:bash 预拉取
      # (git-bash 在 Windows 提供 bash+du+curl),模型就位后 build.rs 跳过。
      - name: Fetch embedding model
        run: bash crates/embedding/scripts/fetch-model.sh

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Smoke-test binary
        run: ./target/${{ matrix.target }}/release/${{ matrix.executable }} --version

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Place binary into platform package
        run: |
          mkdir -p ${{ matrix.pkg-dir }}/bin
          cp target/${{ matrix.target }}/release/${{ matrix.executable }} ${{ matrix.pkg-dir }}/bin/${{ matrix.executable }}

      - name: Verify package contents
        run: npm pack --dry-run
        working-directory: ${{ matrix.pkg-dir }}

      - name: Publish platform package
        run: npm publish --access public
        working-directory: ${{ matrix.pkg-dir }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-main:
    name: publish main package
    needs: build-platform
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # 主包只发 Node shim(bin/cli.js + lib),不含 binary,无需模型或编译。
      - name: Verify package contents
        run: npm pack --dry-run
        working-directory: packages/npm

      - name: Publish main package
        run: npm publish --access public
        working-directory: packages/npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # 发布卡点(P0-A′,第四轮反馈):五包 publish 后强制校验——registry 存在性 +
  # 干净目录安装冒烟,带沉降重试(CDN 传播窗口实测 5-10 分钟、各包独立交错)。
  # 真漏发/半截发版在此红灯,发布页直接可见,不再依赖人工跑 scripts/release_verify.sh。
  verify-release:
    name: verify release (registry + smoke)
    needs: publish-main
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify five packages + clean install smoke
        run: RETRIES=10 INTERVAL_SEC=90 bash scripts/release_verify.sh
