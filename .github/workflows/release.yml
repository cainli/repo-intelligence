name: release

# 打 v* tag 自动触发,或 Actions 页手动触发(从 main)。
# 4 个可靠平台(linux-x64/arm64、darwin-arm64、win32-x64)原生构建,全过才发主包;
# darwin-x64(Intel Mac)单列 best-effort:ort 对 x86_64-apple-darwin 无预编译、不能从
# arm64 交叉编译,只能用稀缺的 macos-13 原生 runner,队列慢且可能失败——故不阻塞主包,
# 跑成则额外覆盖 Intel Mac,跑不成其余平台照常发布(optionalDependencies 缺失仅为 warning)。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-platform:
    name: build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-14
            target: aarch64-apple-darwin
            executable: repo-intelligence
            pkg-dir: packages/npm-platforms/darwin-arm64
          - platform: linux-x64-gnu
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            executable: repo-intelligence
            pkg-dir: packages/npm-platforms/linux-x64-gnu
          - platform: linux-arm64-gnu
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            executable: repo-intelligence
            pkg-dir: packages/npm-platforms/linux-arm64-gnu
          - platform: win32-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            executable: repo-intelligence.exe
            pkg-dir: packages/npm-platforms/win32-x64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '.'
          key: ${{ matrix.target }}

      # embedding 模型 gitignore,不进仓库。build.rs 缺模型时调 bash,但 Windows build.rs
      # 子进程找不到 bash 会崩 → include_bytes! 失败。故构建前统一 shell:bash 预拉取
      # (git-bash 在 Windows 提供 bash+du+curl),模型就位后 build.rs 跳过。
      - name: Fetch embedding model
        run: bash crates/embedding/scripts/fetch-model.sh

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Smoke-test binary
        run: ./target/${{ matrix.target }}/release/${{ matrix.executable }} --version

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Place binary into platform package
        run: |
          mkdir -p ${{ matrix.pkg-dir }}/bin
          cp target/${{ matrix.target }}/release/${{ matrix.executable }} ${{ matrix.pkg-dir }}/bin/${{ matrix.executable }}

      - name: Verify package contents
        run: npm pack --dry-run
        working-directory: ${{ matrix.pkg-dir }}

      - name: Publish platform package
        run: npm publish --access public
        working-directory: ${{ matrix.pkg-dir }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # best-effort:Intel Mac。不阻塞主包发布(continue-on-error + publish-main 不依赖它)。
  build-darwin-x64:
    name: build (darwin-x64) [best-effort]
    runs-on: macos-13
    continue-on-error: true
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '.'
          key: x86_64-apple-darwin

      - name: Fetch embedding model
        run: bash crates/embedding/scripts/fetch-model.sh

      - name: Build release binary
        run: cargo build --release --locked

      - name: Smoke-test binary
        run: ./target/release/repo-intelligence --version

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Place binary into platform package
        run: |
          mkdir -p packages/npm-platforms/darwin-x64/bin
          cp target/release/repo-intelligence packages/npm-platforms/darwin-x64/bin/repo-intelligence

      - name: Verify package contents
        run: npm pack --dry-run
        working-directory: packages/npm-platforms/darwin-x64

      - name: Publish platform package
        run: npm publish --access public
        working-directory: packages/npm-platforms/darwin-x64
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-main:
    name: publish main package
    needs: build-platform
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # 主包只发 Node shim(bin/cli.js + lib),不含 binary,无需模型或编译。
      - name: Verify package contents
        run: npm pack --dry-run
        working-directory: packages/npm

      - name: Publish main package
        run: npm publish --access public
        working-directory: packages/npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
